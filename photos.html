<!DOCTYPE html>
<html>
<head>
<title>Our Memories</title>
<style>
body{
margin:0;
font-family:Arial;
text-align:center;
background:linear-gradient(135deg,#ff7aa2,#ffb6c1);
color:white;
padding:40px;
overflow:hidden;
position:relative;
 /* السماح بالتمرير */
  overflow-y: auto;
}
/* الجاليري */
.gallery{
display:grid;
grid-template-columns:repeat(3,200px);
gap:20px;
justify-content:center;
position:relative;
z-index:2;
}
.photo{
position:relative;
}
.photo img{
width:200px;
border-radius:10px;
}
/* النص فوق الصورة */
.text{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
color:white;
display:flex;
align-items:center;
justify-content:center;
opacity:0;
border-radius:10px;
transition:0.3s;
}
.photo:hover .text{
opacity:1;
}
/* زرار */
button{
margin-top:30px;
padding:12px 25px;
border:none;
border-radius:20px;
background:white;
color:#ff4d88;
cursor:pointer;
position:relative;
z-index:2;
}
/* العناصر المتحركة */
.item{
position:absolute;
font-size:26px;
pointer-events:none;
}
/* حركة القلوب */
.heart{
animation:floatUp linear forwards;
}
@keyframes floatUp{
0%{
transform:translateY(100vh);
opacity:1;
}
100%{
transform:translateY(-10vh);
opacity:0;
}
}
/* حركة الفراشات */
.butterfly{
animation:flySide linear forwards;
}
@keyframes flySide{
0%{
transform:translateX(-10vw);
opacity:1;
}
100%{
transform:translateX(110vw);
opacity:0;
}
}
/* استجابة الموبايل */
@media (max-width: 600px){
  .gallery{
    grid-template-columns:repeat(1, 80%);
    gap:15px;
  }
  .photo img{
    width:100%;
  }
}
</style>
</head>
<body>
<h1>Our Memories</h1>
<div class="gallery">
<div class="photo">
<img src="WhatsApp Image 2026-03-09 at 5.47.54 AM.jpeg">
<div class="text">Our first memory together</div>
</div>
<div class="photo">
<img src="imges/WhatsApp Image 2026-03-09 at 5.47.53 AM.jpeg">
<div class="text">You made me smile</div>
</div>
<div class="photo">
<img src="imges/WhatsApp Image 2026-03-09 at 5.47.53 AM (3).jpeg">
<div class="text">Thank you for always listening</div>
</div>
<div class="photo">
<img src="imges/WhatsApp Image 2026-03-09 at 5.47.53 AM (1).jpeg">
<div class="text">You’re my safe place</div>
</div>
<div class="photo">
<img src="imges/WhatsApp Image 2026-03-09 at 5.47.52 AM.jpeg">
<div class="text">You make everything brighter  </div>
</div>
<div class="photo">
<img src="imges/WhatsApp Image 2026-03-09 at 5.47.53 AM (2).jpeg">
<div class="text">A day I'll never forget</div>
</div>
</div>
<button onclick="location.href='message.html'">
Next
</button>
<script>
/* عناصر متحركة */
function createItem(){
let item=document.createElement("div");
item.classList.add("item");
let shapes=["💗"];
let shape=shapes[Math.floor(Math.random()*shapes.length)];
item.innerHTML=shape;
if(shape=="💗"){
item.classList.add("heart");
item.style.left=Math.random()*100+"vw";
item.style.animationDuration=(5+Math.random()*4)+"s";
}
document.body.appendChild(item);
setTimeout(()=>{
item.remove();
},9000);
}
setInterval(createItem,600);
</script>
</body>

</html>
